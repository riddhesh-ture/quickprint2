name: Supabase Keep-Alive Heartbeat

on:
  schedule:
    # Runs daily at 00:00 UTC to ensure active DB write transactions and prevent Supabase 7-day pause
    - cron: '0 0 * * *'
  workflow_dispatch: # Allows manual trigger anytime from Actions tab
  push:
    branches:
      - main
    paths:
      - '.github/workflows/supabase-keepalive.yml'

jobs:
  ping:
    name: Ping Supabase Project
    runs-on: ubuntu-latest
    steps:
      - name: Send Keepalive Ping to Supabase
        env:
          SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL || secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY || secrets.VITE_SUPABASE_ANON_KEY || secrets.SUPABASE_KEY || secrets.SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_KEY" ]; then
            echo "::error ::Supabase secrets (VITE_SUPABASE_URL and VITE_SUPABASE_PUBLISHABLE_KEY / VITE_SUPABASE_ANON_KEY) not found in GitHub repository secrets!"
            exit 1
          fi

          echo "Pinging Supabase via active DB write (PATCH /rest/v1/keepalive)..."
          CURRENT_TIME=$(date -u +"%Y-%m-%dT%H:%M:%SZ")

          STATUS=$(curl -s -o /dev/null -w "%{http_code}" -X PATCH \
            -H "apikey: $SUPABASE_KEY" \
            -H "Authorization: Bearer $SUPABASE_KEY" \
            -H "Content-Type: application/json" \
            -H "Prefer: return=minimal" \
            -d "{\"last_ping\":\"$CURRENT_TIME\"}" \
            "$SUPABASE_URL/rest/v1/keepalive?id=eq.1")

          echo "PATCH /keepalive response code: $STATUS"

          # Fallback to GET if PATCH fails or table not yet initialized with row 1
          if [ "$STATUS" -lt 200 ] || [ "$STATUS" -ge 300 ]; then
            echo "PATCH returned non-2xx ($STATUS), falling back to GET keepalive..."
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
              -H "apikey: $SUPABASE_KEY" \
              -H "Authorization: Bearer $SUPABASE_KEY" \
              "$SUPABASE_URL/rest/v1/keepalive?select=id&limit=1")
          fi

          # Second fallback to merchants table if keepalive table not found
          if [ "$STATUS" = "404" ]; then
            echo "Keepalive table not found (404), falling back to merchants table..."
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
              -H "apikey: $SUPABASE_KEY" \
              -H "Authorization: Bearer $SUPABASE_KEY" \
              "$SUPABASE_URL/rest/v1/merchants?select=id&limit=1")
          fi

          echo "Final Supabase response code: $STATUS"
          if [ "$STATUS" -ge 200 ] && [ "$STATUS" -lt 300 ]; then
            echo "✅ Keepalive successfully recorded! Active PostgreSQL transaction refreshed at $CURRENT_TIME."
          else
            echo "::error ::Supabase returned non-success HTTP status: $STATUS"
            exit 1
          fi
